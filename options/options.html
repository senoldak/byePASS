<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>byePASS - Seçenekler & Ayarlar</title>
  <link rel="stylesheet" href="options_all.css"/>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header glass-card">
      <div class="brand-wrapper">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </svg>
        </div>
        <div class="brand-title-group">
          <h1 id="top">byePASS <span class="badge-version" id="version"></span></h1>
          <p class="brand-subtitle">Gelişmiş Paywall, Çerez & Overlay Filtre Kontrol Paneli</p>
        </div>
      </div>

      <!-- Navigation Pills -->
      <nav class="nav-pills">
        <a href="options.html" class="nav-link active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Genel Siteler
        </a>
        <a href="options_custom.html" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          Özel Siteler
        </a>
        <a href="options_excluded.html" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
          Hariç Tutulanlar
        </a>
        <a href="optin/opt-in.html" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          İzinler & Opt-in
        </a>
        <a href="/README.html" target="_blank" class="nav-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          Yardım
        </a>
      </nav>
    </header>

    <!-- Version & Updates Alert -->
    <div id="version_new"></div>
    <div id="perm-custom"></div>
    <div id="nofix"></div>

    <!-- Main Content Glass Card -->
    <main class="glass-card">
      <!-- Toolbar Controls -->
      <div class="controls-bar" style="margin-bottom: 20px;">
        <div class="controls-left">
          <button id="save_top" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Değişiklikleri Kaydet
          </button>
          <button id="check_sites_updated" class="btn btn-secondary btn-sm" title="Güncellenen site kurallarını kontrol et">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
            Güncellemeleri Tara
          </button>
          <button id="clear_sites_updated" class="btn btn-secondary btn-sm" title="Güncelleme önbelleğini temizle">Temizle</button>
        </div>

        <div class="search-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="search" class="search-input" type="text" placeholder="Domain veya site adı ara...">
        </div>
      </div>

      <div id="status_top"></div>

      <!-- Site Lists Container -->
      <div id="bypass_sites"></div>

      <div id="status"></div>
      <div id="error"></div>
    </main>

    <!-- Bottom Sticky Action Bar -->
    <div class="bottom-dock">
      <div class="controls-left">
        <button id="save" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          Kaydet
        </button>
        <button id="select-all" class="btn btn-secondary btn-sm">Tümünü Seç</button>
        <button id="select-none" class="btn btn-secondary btn-sm">Hiçbirini Seçme</button>
      </div>

      <div class="controls-right">
        <a href="#top" class="btn btn-secondary btn-sm" style="text-decoration:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
          Başa Dön
        </a>
        <button id="button-close" class="btn btn-secondary btn-sm">Kapat</button>
      </div>
    </div>
  </div>

  <script src="../sites.js"></script>
  <script src="options.js"></script>
  <script src="version.js"></script>
</body>
</html>
