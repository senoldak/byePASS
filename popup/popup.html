<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>byePASS</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </svg>
        </div>
        <div class="title-group">
          <h1>byePASS</h1>
          <span class="badge">v1.0</span>
        </div>
      </div>
      <button id="btnOptions" class="icon-btn" title="Ayarlar ve Seçenekler">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Site Status Card -->
    <div class="site-card">
      <div class="site-info">
        <span class="site-label">Aktif Sekme</span>
        <div class="site-domain" id="siteDomain">Yükleniyor...</div>
      </div>
      <div class="status-pill" id="siteStatus">
        <span class="dot"></span>
        <span class="text">Hazır</span>
      </div>
    </div>

    <!-- Quick Clean Action Buttons -->
    <div class="action-grid">
      <button id="btnCleanDOM" class="primary-action-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
        </svg>
        <span>Engelleri Temizle</span>
      </button>
      <button id="btnClearStorage" class="secondary-action-btn" title="Çerezleri ve sayaçları sıfırla">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>Çerez Sıfırla</span>
      </button>
    </div>

    <!-- Toggles Section -->
    <div class="toggle-list">
      <div class="toggle-item">
        <div class="toggle-label">
          <span class="title">Otomatik Koruma</span>
          <span class="desc">Sayfa açıldığında kilitleri kaldır</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleAuto" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- External Archive & Bypass Mirrors -->
    <div class="archive-section">
      <div class="section-title">
        <span>Arşiv & Ayna Servisleri</span>
      </div>
      <div class="archive-grid">
        <button class="archive-btn" id="btnArchiveToday" title="Archive.today">
          <span class="arch-icon">🏛️</span>
          <span class="arch-name">Archive.today</span>
        </button>
        <button class="archive-btn" id="btn12ft" title="12ft Ladder">
          <span class="arch-icon">🪜</span>
          <span class="arch-name">12ft.io</span>
        </button>
        <button class="archive-btn" id="btnWayback" title="Wayback Machine">
          <span class="arch-icon">⏳</span>
          <span class="arch-name">Wayback</span>
        </button>
        <button class="archive-btn" id="btnFreedium" title="Freedium Medium Reader">
          <span class="arch-icon">📖</span>
          <span class="arch-name">Freedium</span>
        </button>
      </div>
    </div>

    <!-- Footer Feedback Message -->
    <footer class="footer" id="statusMessage">
      byePASS aktif & hazır
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
